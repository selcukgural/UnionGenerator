name: Publish on Version Change

# Trigger when code is pushed to main branch
on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.csproj'
      - 'src/**/*.cs'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      current_version: ${{ steps.check.outputs.current_version }}
    
    steps:
    - name: Checkout current code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get current version from .csproj
      id: current
      run: |
        CURRENT_VERSION=$(grep -m 1 "<Version>" src/UnionGenerator/UnionGenerator/UnionGenerator.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d '[:space:]')
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Get previous version from last commit
      id: previous
      run: |
        # Get the .csproj file from the previous commit
        git checkout HEAD~1 -- src/UnionGenerator/UnionGenerator/UnionGenerator.csproj || true
        if [ -f src/UnionGenerator/UnionGenerator/UnionGenerator.csproj ]; then
          PREVIOUS_VERSION=$(grep -m 1 "<Version>" src/UnionGenerator/UnionGenerator/UnionGenerator.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d '[:space:]')
        else
          PREVIOUS_VERSION="0.0.0"
        fi
        echo "version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
        echo "Previous version: $PREVIOUS_VERSION"
        # Reset the file
        git checkout HEAD -- src/UnionGenerator/UnionGenerator/UnionGenerator.csproj || true
    
    - name: Check if version changed
      id: check
      run: |
        CURRENT="${{ steps.current.outputs.version }}"
        PREVIOUS="${{ steps.previous.outputs.version }}"
        
        if [ "$CURRENT" != "$PREVIOUS" ]; then
          echo "version_changed=true" >> $GITHUB_OUTPUT
          echo "✅ Version changed: $PREVIOUS → $CURRENT"
        else
          echo "version_changed=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Version unchanged: $CURRENT"
        fi
        echo "current_version=$CURRENT" >> $GITHUB_OUTPUT

  publish:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Display version info
      run: |
        echo "🚀 Publishing version: ${{ needs.check-version.outputs.current_version }}"
        echo "📦 NuGet packages will be published to NuGet.org"
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=${{ needs.check-version.outputs.current_version }}
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Pack NuGet packages
      run: dotnet pack --configuration Release --no-build --output ./nupkgs /p:PackageVersion=${{ needs.check-version.outputs.current_version }}
    
    - name: List generated packages
      run: |
        echo "📦 Generated NuGet packages:"
        ls -lh ./nupkgs/
    
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push ./nupkgs/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    
    - name: Create Git tag
      run: |
        VERSION="${{ needs.check-version.outputs.current_version }}"
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.check-version.outputs.current_version }}
        name: Release v${{ needs.check-version.outputs.current_version }}
        files: ./nupkgs/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(needs.check-version.outputs.current_version, 'alpha') || contains(needs.check-version.outputs.current_version, 'beta') || contains(needs.check-version.outputs.current_version, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload NuGet packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-v${{ needs.check-version.outputs.current_version }}
        path: ./nupkgs/*.nupkg
        retention-days: 90
    
    - name: Publish summary
      run: |
        echo "### ✅ NuGet Publish Successful" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ needs.check-version.outputs.current_version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Published Packages:**" >> $GITHUB_STEP_SUMMARY
        for pkg in ./nupkgs/*.nupkg; do
          echo "- $(basename $pkg)" >> $GITHUB_STEP_SUMMARY
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Links:**" >> $GITHUB_STEP_SUMMARY
        echo "- [NuGet.org](https://www.nuget.org/packages/UnionGenerator)" >> $GITHUB_STEP_SUMMARY
        echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.current_version }})" >> $GITHUB_STEP_SUMMARY
